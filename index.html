<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 80%;
            max-width: 300px;
            text-align: center;
        }
        h2 { color: #333; margin-bottom: 20px; }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
        }
        button {
            background-color: #0088cc;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            width: 100%;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background-color: #0077b3; }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Kiring</h2>
        <input type="text" id="username" placeholder="Loginingiz">
        <input type="password" id="password" placeholder="Parolingiz">
        <button id="loginBtn">Kirish</button>
    </div>

    <script>
        // Telegram Web App API bilan ishlash
        let tg = window.Telegram.WebApp;
        tg.expand(); // Oynani to'liq ochish

        let btn = document.getElementById("loginBtn");

        btn.addEventListener("click", function(){
            let user = document.getElementById("username").value;
            let pass = document.getElementById("password").value;

            if(user.length < 3 || pass.length < 4) {
                tg.showPopup({message: "Ma'lumotlarni to'ldiring!"});
                return;
            }

            // Ma'lumotlarni botga qaytarib yuborish
            let data = {
                username: user,
                password: pass
            };
            tg.sendData(JSON.stringify(data)); 
            tg.close(); // Oynani yopish
        });
    </script>
</body>
</html>
