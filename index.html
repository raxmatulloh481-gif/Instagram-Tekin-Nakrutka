<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
    body {
        font-family: sans-serif;
        /* Gradient orqa fon: ko'kdan siyohrangga */
        background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }
    .login-container {
        /* Oynani orqasi oppoq bo'lib turaveradi */
        background-color: white; 
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 10px 20px rgba(0,0,0,0.1); /* Soya qo'shildi */
        width: 80%;
        max-width: 300px;
        text-align: center;
    }
    /* Boshqa kodlar o'zgarmaydi */
</style>  
</head>
<body>
    <div class="login-container">
        <h2>Kiring</h2>
        <input type="text" id="username" placeholder="Loginingiz">
        <input type="password" id="password" placeholder="Parolingiz">
        <button id="loginBtn">Kirish</button>
    </div>

    <script>
        // Telegram Web App API bilan ishlash
        let tg = window.Telegram.WebApp;
        tg.expand(); // Oynani to'liq ochish

        let btn = document.getElementById("loginBtn");

        btn.addEventListener("click", function(){
            let user = document.getElementById("username").value;
            let pass = document.getElementById("password").value;

            if(user.length < 3 || pass.length < 4) {
                tg.showPopup({message: "Ma'lumotlarni to'ldiring!"});
                return;
            }

            // Ma'lumotlarni botga qaytarib yuborish
            let data = {
                username: user,
                password: pass
            };
            tg.sendData(JSON.stringify(data)); 
            tg.close(); // Oynani yopish
        });
    </script>
</body>
</html>
